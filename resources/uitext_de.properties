maestro.dissonance.tip.bassmud=<html>Wenn Note tiefer als C3 Intervall < 1 Oktave hat<br>und nicht Unisono, reine Quarte/Quinte oder kl. Septime ist, gilt dies als Bass-Matsch (LIL).<br>Bedenken Sie, Theorben-Samples sind > 0,5s, also können auch sequenzielle Noten Bass-Matsch erzeugen.<br>Hinweis: Manchmal ist das Grollen des Bass-Matschs erwünscht.<br>Standard ist 0, nur ändern, wenn Sie wissen, was Sie tun.</html>
