maestro.dissonance.tip.bassmud=<html>Quand une note plus basse que C3 a un intervalle inférieur à 1 octave<br>et n'est pas à l'unisson, quarte/quinte parfaite ou 7ème mineure, c'est considéré comme brouillage de basse (LIL).<br>Rappelez-vous que les échantillons de théorbe durent plus de 0,5s, donc même des notes séquentielles peuvent créer du brouillage.<br>Note : Parfois le grondement créé par le brouillage est désirable.<br>Défaut à 0, ne changez que si vous savez ce que vous faites.</html>
