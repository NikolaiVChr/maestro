maestro.tip.mix.swing.prio=<html>Autoriser Maestro à détecter quelles notes<br>nécessitent un timing triolet/swing.<br><br>Cela se fait par partie, donc certaines notes d'une partie peuvent être exportées en swing/triolets<br>tandis que d'autres parties exportent des notes paires en même temps.<br>En cas d'incertitude, swing/triolet sera choisi.<br>Permet de définir la priorité des pistes.<br>Des cases à cocher apparaîtront lors de la combinaison des pistes,<br>celles activées prioriseront les timings de ces pistes sur les pistes non prioritaires.</html>
