maestro.sectionedit.help=<html><b>Les sections activées ne doivent pas se chevaucher.<br>Numéros de mesure utilisent numérotation MIDI originale.<br>Décimales autorisées.<br>Numéros de mesure non négatifs.<br>Mesures 'De' incluses, 'À' exclues.<br>APPLIQUER désactive les sections incorrectes.<br><br>Attention : Si 'Supprimer silence initial' actif ou<br>signature rythmique modifiée, le compteur en bas à droite<br>peut ne pas correspondre, sauf en aperçu 'Original'.<br><br>Doubler copie toutes les notes<br>et les colle 1 ou 2 octaves<br>de leur hauteur originale.<br><br>La dernière ligne 'Reste de la piste' contient toutes<br>les notes non couvertes par des sections.</b></html>
