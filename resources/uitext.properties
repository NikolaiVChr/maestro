# File charset: UTF-8
#
# The file consists of key-value pairs, separated by an equals sign (=).
# Be careful; some values start with space (\ ) and some end with space ( ).
# Some values are HTML code. Look for <br> or <html> tags for a clue to which ones.
# {0},{1},{4} or {3} are placeholders for parameters that are filled out by the application.
# Look for the English values to get a feel for short texts that many times cannot be much longer than a couple of letters.
# The \n character is used to start a new line for non-html. For HTML, <br> is used.
# To use the ' character in values that contain {0},{1},{2} or {3}, use them double: ''
# For HTML to force a space character when you want more than one space, use &nbsp; (including both the & and ;).
# Do NOT change the order of the lines in the file. Context often clumps especially the maestro lines together.
# Never change the key names. Only the values.
#
# To break long values:
# End the line with \
# Ensure no spaces exist after the \
# Indent the next line as much as you want (Java ignores that indentation).
# Remember to add a space before the \ if you are splitting words, otherwise "end" and "start" become "endstart".
#
