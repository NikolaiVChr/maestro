name: Build Draft Release

on:
  workflow_dispatch:

permissions:
  contents: write        # required for the gh CLI to create/update the draft release

jobs:
  build:
    name: Build MSI + ZIP (Windows, Ant)
    runs-on: windows-latest

    env:
      MAVEN_ARGS: -B      # setup-java also appends -ntp to quiet Maven transfer logs

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Oracle JDK 25.0.4
        uses: actions/setup-java@v5
        with:
          distribution: oracle    # Oracle JDK (No-Fee Terms license), includes jmods
          java-version: '25'  # if Oracle later drops 25.0.4, use '25' for latest
          cache: maven
        # setup-java exports JAVA_HOME, which build.xml reads via ${env.JAVA_HOME}.

      # Ant + Maven are preinstalled on windows-latest. Distribute runs
      # mvn clean install, then jpackage + WiX to produce the MSI and ZIP.
      - name: Run Ant Distribute
        working-directory: distribute
        run: ant Distribute

      # Attaches the MSI + ZIP to a versioned draft release. The version is read
      # from the produced zip name (Maestro_v<version>.zip), which Ant derives from
      # resources/com/digero/maestro/version.properties. gh is the official GitHub
      # CLI, preinstalled on the runner.
      - name: Publish to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip=$(ls distribute/output/Maestro_v*.zip | head -n1)
          ver=$(basename "$zip" .zip | sed -E 's/^Maestro_v//')
          tag="v$ver"
          
          # Extract this version's changelog block from readme.txt:
          #  - strip trailing CR (readme is CRLF)
          #  - start after the "Version <ver>" header line (exact field match)
          #  - stop at the next "Version x.y.z" header or end of file
          notes=$(awk -v ver="$ver" '
            { sub(/\r$/, "") }
            # A version header line: optional leading #s, optional "Version "/"v",
            # then the number alone (e.g. "Version 4.6.22", "## 4.6.22", "v4.6.22").
            /^#*[[:space:]]*([Vv]ersion[[:space:]]+|[vV])?[0-9]+\.[0-9]+([.][0-9]+)?[[:space:]]*$/ {
              v = $0; gsub(/[^0-9.]/, "", v)
              if (v == ver)  { grab = 1; next }   # start of our section
              else if (grab) { exit }             # next section reached
              else           { next }
            }
            grab { print }
          ' distribute/readme.txt)
          
          # Fall back to the whole file if the section was not found.
          if [ -z "$notes" ]; then notes=$(sed 's/\r$//' distribute/readme.txt); fi
          printf '%s\n' "$notes" > release-notes.md
          
          echo "Releasing Maestro $ver as draft $tag"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" distribute/output/*.msi distribute/output/*.zip \
            --draft \
            --title "Maestro $ver" \
            --notes-file release-notes.md
          # To also append GitHub's auto commit/PR list, add:  --generate-notes